name: asset-radar

services:
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      ASSET_RADAR_KIS_APP_KEY: ${ASSET_RADAR_KIS_APP_KEY:-}
      ASSET_RADAR_KIS_APP_SECRET: ${ASSET_RADAR_KIS_APP_SECRET:-}
      ASSET_RADAR_ALPHAVANTAGE_API_KEY: ${ASSET_RADAR_ALPHAVANTAGE_API_KEY:-}
      ASSET_RADAR_FINNHUB_API_KEY: ${ASSET_RADAR_FINNHUB_API_KEY:-}
      ASSET_RADAR_ALERT_SLACK_WEBHOOK_URL: ${ASSET_RADAR_ALERT_SLACK_WEBHOOK_URL:-}
      ASSET_RADAR_ALERT_NOTIFIER_SLACK_ENABLED: ${ASSET_RADAR_ALERT_NOTIFIER_SLACK_ENABLED:-false}
      ASSET_RADAR_ALERT_DISCORD_WEBHOOK_URL: ${ASSET_RADAR_ALERT_DISCORD_WEBHOOK_URL:-}
      ASSET_RADAR_ALERT_NOTIFIER_DISCORD_ENABLED: ${ASSET_RADAR_ALERT_NOTIFIER_DISCORD_ENABLED:-false}
      ASSET_RADAR_ALERT_WEBHOOK_URL: ${ASSET_RADAR_ALERT_WEBHOOK_URL:-}
      ASSET_RADAR_ALERT_WEBHOOK_AUTH_TOKEN: ${ASSET_RADAR_ALERT_WEBHOOK_AUTH_TOKEN:-}
      ASSET_RADAR_ALERT_NOTIFIER_WEBHOOK_ENABLED: ${ASSET_RADAR_ALERT_NOTIFIER_WEBHOOK_ENABLED:-false}
      ASSET_RADAR_BINANCE_ENABLED: ${ASSET_RADAR_BINANCE_ENABLED:-false}
      ASSET_RADAR_FINNHUB_ENABLED: ${ASSET_RADAR_FINNHUB_ENABLED:-false}
    ports:
      - "8081:8080"
    depends_on:
      - kafka
      - redis
      - postgres
      - tempo

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - app

  kafka:
    image: confluentinc/cp-kafka:8.1.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asset_radar
      POSTGRES_USER: asset_radar
      POSTGRES_PASSWORD: asset_radar
    ports:
      - "5433:5432"

  prometheus:
    image: prom/prometheus:v3.3.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager

  loki:
    image: grafana/loki:3.4.2
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.4.2
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.7.2
    command:
      - "-config.file=/etc/tempo/config.yml"
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
