name: asset-radar-prod

services:
  app:
    image: ${ASSET_RADAR_API_IMAGE:-ghcr.io/jean202/asset-radar-api}:${ASSET_RADAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_R2DBC_URL: ${SPRING_R2DBC_URL:-r2dbc:postgresql://postgres:5432/asset_radar}
      SPRING_R2DBC_USERNAME: ${SPRING_R2DBC_USERNAME:-asset_radar}
      SPRING_R2DBC_PASSWORD: ${SPRING_R2DBC_PASSWORD}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-}
      ASSET_RADAR_KIS_APP_KEY: ${ASSET_RADAR_KIS_APP_KEY:-}
      ASSET_RADAR_KIS_APP_SECRET: ${ASSET_RADAR_KIS_APP_SECRET:-}
      ASSET_RADAR_ALPHAVANTAGE_API_KEY: ${ASSET_RADAR_ALPHAVANTAGE_API_KEY:-}
      ASSET_RADAR_FINNHUB_API_KEY: ${ASSET_RADAR_FINNHUB_API_KEY:-}
      ASSET_RADAR_BINANCE_ENABLED: ${ASSET_RADAR_BINANCE_ENABLED:-false}
      ASSET_RADAR_FINNHUB_ENABLED: ${ASSET_RADAR_FINNHUB_ENABLED:-false}
      ASSET_RADAR_ALERT_SLACK_WEBHOOK_URL: ${ASSET_RADAR_ALERT_SLACK_WEBHOOK_URL:-}
      ASSET_RADAR_ALERT_NOTIFIER_SLACK_ENABLED: ${ASSET_RADAR_ALERT_NOTIFIER_SLACK_ENABLED:-false}
      ASSET_RADAR_ALERT_DISCORD_WEBHOOK_URL: ${ASSET_RADAR_ALERT_DISCORD_WEBHOOK_URL:-}
      ASSET_RADAR_ALERT_NOTIFIER_DISCORD_ENABLED: ${ASSET_RADAR_ALERT_NOTIFIER_DISCORD_ENABLED:-false}
      ASSET_RADAR_ALERT_WEBHOOK_URL: ${ASSET_RADAR_ALERT_WEBHOOK_URL:-}
      ASSET_RADAR_ALERT_WEBHOOK_AUTH_TOKEN: ${ASSET_RADAR_ALERT_WEBHOOK_AUTH_TOKEN:-}
      ASSET_RADAR_ALERT_NOTIFIER_WEBHOOK_ENABLED: ${ASSET_RADAR_ALERT_NOTIFIER_WEBHOOK_ENABLED:-false}
    ports:
      - "${ASSET_RADAR_API_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: ${ASSET_RADAR_FRONTEND_IMAGE:-ghcr.io/jean202/asset-radar-frontend}:${ASSET_RADAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${ASSET_RADAR_FRONTEND_PORT:-80}:80"
    depends_on:
      app:
        condition: service_started

  kafka:
    image: confluentinc/cp-kafka:8.1.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_radar}
      POSTGRES_USER: ${POSTGRES_USER:-asset_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asset_radar} -d ${POSTGRES_DB:-asset_radar}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-data:
  redis-data:
  postgres-data:
