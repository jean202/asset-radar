groups:
  - name: asset-radar
    rules:
      - alert: ObservabilityComponentDown
        expr: up{job=~"prometheus|grafana|loki|tempo|alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Observability component is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: AssetRadarCollectorErrors
        expr: sum by (source) (increase(asset_collector_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Collector errors detected"
          description: "{{ $labels.source }} collector reported errors in the last 5 minutes."

      - alert: AssetRadarAnalysisPipelineIdle
        expr: sum(increase(asset_collector_prices_total[10m])) > 0 and sum(increase(asset_analysis_processed_total[10m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Analysis pipeline appears stalled"
          description: "Collectors are still producing prices, but no analysis events were processed in the last 10 minutes."

      - alert: AssetRadarAlertPipelineIdle
        expr: sum(increase(asset_analysis_processed_total[10m])) > 0 and sum(increase(asset_alerts_evaluated_total[10m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alert pipeline appears stalled"
          description: "Analysis events are still being processed, but alert evaluation stopped for the last 10 minutes."

      - alert: AssetRadarApi5xxBurst
        expr: sum(rate(http_server_requests_seconds_count{service="asset-radar",status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API is returning 5xx responses"
          description: "The asset-radar API returned more than 0.05 5xx responses per second over the last 5 minutes."

      - alert: AssetRadarApiLatencyP99High
        expr: histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{service="asset-radar"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API P99 latency is high"
          description: "{{ $labels.uri }} P99 latency has been above 1s for more than 5 minutes (current: {{ $value | humanizeDuration }})."

      - alert: AssetRadarKafkaConsumerLagHigh
        expr: max by (client_id, topic) (kafka_consumer_fetch_manager_records_lag) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer {{ $labels.client_id }} on topic {{ $labels.topic }} has a lag of {{ $value }} records for more than 5 minutes."

      - alert: AssetRadarAlertTriggerRatioAnomaly
        expr: (sum(rate(asset_alerts_triggered_total[10m])) / sum(rate(asset_alerts_evaluated_total[10m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alert trigger ratio is abnormally high"
          description: "More than half of evaluated alerts triggered over the last 10 minutes ({{ $value | humanizePercentage }}), which suggests a threshold misconfiguration or a market-wide anomaly."

      - alert: AssetRadarJvmHeapUsageHigh
        expr: sum(jvm_memory_used_bytes{service="asset-radar",area="heap"}) / sum(jvm_memory_max_bytes{service="asset-radar",area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage is high"
          description: "asset-radar heap usage has been above 85% for more than 5 minutes ({{ $value | humanizePercentage }})."
