name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish and deploy. Defaults to the current ref name."
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="${{ github.event.inputs.image_tag }}"

          if [ -z "$tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi

          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            tag="${GITHUB_SHA::12}"
          fi

          echo "api=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        shell: bash
        run: |
          : "${SSH_PRIVATE_KEY:?PROD_SSH_PRIVATE_KEY is required}"
          : "${SSH_HOST:?PROD_SSH_HOST is required}"

          port="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/asset_radar_deploy
          chmod 600 ~/.ssh/asset_radar_deploy
          ssh-keyscan -p "$port" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy production compose file
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/opt/asset-radar' }}
        shell: bash
        run: |
          : "${SSH_USER:?PROD_SSH_USER is required}"
          port="${SSH_PORT:-22}"

          ssh -i ~/.ssh/asset_radar_deploy -p "$port" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

          scp -i ~/.ssh/asset_radar_deploy -P "$port" \
            deploy/docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/opt/asset-radar' }}
          ASSET_RADAR_API_IMAGE: ${{ steps.images.outputs.api }}
          ASSET_RADAR_FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          ASSET_RADAR_IMAGE_TAG: ${{ steps.images.outputs.tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        shell: bash
        run: |
          port="${SSH_PORT:-22}"

          ssh -i ~/.ssh/asset_radar_deploy -p "$port" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' \
             ASSET_RADAR_API_IMAGE='$ASSET_RADAR_API_IMAGE' \
             ASSET_RADAR_FRONTEND_IMAGE='$ASSET_RADAR_FRONTEND_IMAGE' \
             ASSET_RADAR_IMAGE_TAG='$ASSET_RADAR_IMAGE_TAG' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          if [ ! -f .env.prod ]; then
            echo ".env.prod is missing in $DEPLOY_PATH. Create it from deploy/.env.prod.example before deploying."
            exit 1
          fi

          if [ -n "${GHCR_TOKEN:-}" ]; then
            : "${GHCR_USERNAME:?GHCR_USERNAME is required when GHCR_TOKEN is set}"
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          fi

          export ASSET_RADAR_API_IMAGE
          export ASSET_RADAR_FRONTEND_IMAGE
          export ASSET_RADAR_IMAGE_TAG

          docker compose --env-file .env.prod -f docker-compose.prod.yml pull
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
REMOTE
